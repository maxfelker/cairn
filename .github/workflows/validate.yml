name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # Pinned so a CLI release cannot change the rules under an unrelated PR.
      # Bump deliberately.
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.325

      # `plugin validate` is offline and needs no Claude authentication or
      # secrets. It checks both manifests and every skill under skills/.
      - name: Validate plugin
        run: claude plugin validate . --strict
